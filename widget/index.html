<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Widget</title>
  <!-- Desktop shell loads this with ?overlay=1 → transparent, fills the window -->
  <script>
    var q = new URLSearchParams(location.search);
    if (q.has("overlay")) document.documentElement.classList.add("overlay");
    if (q.get("theme") === "dark") document.documentElement.classList.add("dark");
  </script>
  <!-- Windows fallback for SF Pro (closest matching metrics). Mac/iOS use SF directly. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="calendar.css" />
</head>
<body>
  <!-- The widget. Python feeds it via Calendar.setEvents([...]) — see events.js. -->
  <div id="cal" class="cal"></div>

  <script src="calendar.js"></script>
  <script>
    // events.js is dev-only sample data. Load it only in the browser — never in
    // the packaged Electron shell, where real events arrive over IPC (and the
    // file isn't bundled), so a user's calendar never ships baked into the app.
    if (!new URLSearchParams(location.search).has("overlay")) {
      var s = document.createElement("script");
      s.src = "events.js";
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
